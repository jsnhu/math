<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Drill — Mental Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141a;
    --surface: #1b1e27;
    --surface-2: #242835;
    --border: #333849;
    --text: #edeef2;
    --text-muted: #888ea3;
    --text-faint: #565c6f;
    --accent: #e3b23c;
    --accent-dim: #e3b23c1f;
    --accent-text: #171410;
    --good: #6fcf97;
    --good-dim: #6fcf9722;
    --bad: #e2685f;
    --bad-dim: #e2685f22;
    --radius: 14px;
    --mono: 'Inter', ui-monospace, monospace;
    --sans: 'Manrope', system-ui, sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* subtle grain / vignette so flat dark bg has texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #ffffff08, transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  #app{
    position:relative;
    z-index:1;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
  }

  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    padding:max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    animation: fadeIn .25s ease;
  }
  .screen.active{display:flex;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  h1{font-size:30px; margin:6px 0 0; font-weight:800; letter-spacing:-0.02em;}
  h2{font-size:20px; margin:0 0 4px; font-weight:800; letter-spacing:-0.01em;}
  p.sub{color:var(--text-muted); margin:6px 0 0; font-size:14.5px; line-height:1.5;}

  .btn{
    font-family:var(--sans);
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:15px 18px;
    cursor:pointer;
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); color:var(--accent-text);}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{background:#2a2f3d;}
  .btn-block{width:100%;}

  .icon-btn{
    background:transparent; border:none; color:var(--text-muted);
    font-family:var(--mono); font-size:14px; cursor:pointer; padding:8px;
    display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{color:var(--text);}

  /* ---------- HOME ---------- */
  #screen-home{justify-content:flex-start; padding-top:max(48px, env(safe-area-inset-top));}
  .home-header{margin-bottom:34px;}
  .mode-grid{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .mode-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    transition: border-color .15s ease, transform .08s ease, background .15s ease;
    color:var(--text);
    font-family:var(--sans);
  }
  .mode-card:active{transform:scale(.985);}
  .mode-card:hover{border-color:var(--accent); background:#1e222c;}
  .mode-card .glyph{
    font-family:var(--mono);
    font-size:34px;
    font-weight:700;
    color:var(--accent);
    width:76px;
    text-align:center;
    flex-shrink:0;
  }
  .mode-card .label{flex:1;}
  .mode-card .label .name{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  .mode-card .label .desc{color:var(--text-muted); font-size:13px; margin-top:3px;}
  .mode-card .arrow{color:var(--text-faint); font-family:var(--mono); font-size:18px;}

  /* ---------- SETTINGS ---------- */
  .top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .field-group{margin-bottom:26px;}
  .field-label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.09em;
    margin-bottom:10px;
    display:block;
  }
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:var(--mono);
    font-weight:600;
    font-size:14.5px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:10px;
    padding:12px 0;
    flex:1;
    min-width:56px;
    text-align:center;
    cursor:pointer;
    transition: all .12s ease;
  }
  .chip:active{transform:scale(.95);}
  .chip.selected{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:var(--accent);
  }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 16px;
    margin-bottom:26px;
  }
  .toggle-row .t-label{font-weight:700; font-size:14.5px;}
  .toggle-row .t-desc{color:var(--text-muted); font-size:12.5px; margin-top:3px;}
  .switch{
    width:46px; height:27px; border-radius:20px; background:var(--surface-2);
    border:1px solid var(--border);
    position:relative; cursor:pointer; flex-shrink:0; margin-left:14px;
    transition: background .15s ease;
  }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px;
    width:21px; height:21px; border-radius:50%;
    background:var(--text-faint);
    transition: transform .15s ease, background .15s ease;
  }
  .switch.on{background:var(--accent-dim); border-color:var(--accent);}
  .switch.on::after{transform:translateX(19px); background:var(--accent);}

  .settings-footer{margin-top:auto; padding-top:12px;}
  .range-preview{
    font-family:var(--mono);
    color:var(--text-faint);
    font-size:12px;
    margin-top:8px;
  }

  /* ---------- PRACTICE ---------- */
  #screen-practice{padding-top:max(16px, env(safe-area-inset-top));}
  .practice-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .counter{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-muted);
    letter-spacing:.04em;
  }
  .counter b{color:var(--accent);}
  .progress-track{
    height:3px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin:10px 0 26px;
  }
  .progress-fill{height:100%; background:var(--accent); width:0%; transition: width .25s ease;}

  .problem-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    min-height:0;
  }
  .problem-text{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(40px, 12vw, 58px);
    letter-spacing:-0.01em;
    color:var(--text);
    display:flex; align-items:baseline; gap:14px;
    transition: transform .12s ease;
  }
  .problem-text .op{color:var(--text-faint); font-weight:500;}

  .answer-display{
    font-family:var(--mono);
    font-weight:600;
    font-size:clamp(26px, 8vw, 34px);
    min-height:44px;
    color:var(--accent);
    letter-spacing:.02em;
    border-bottom:2px solid var(--border);
    padding:0 6px 8px;
    min-width:110px;
    text-align:center;
    transition: border-color .12s ease;
  }
  .answer-display.empty::after{
    content:"";
  }
  .answer-display .cursor{
    display:inline-block;
    width:2px; height:1em; background:var(--accent);
    margin-left:2px; vertical-align:-3px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .problem-zone.flash-good .problem-text{color:var(--good);}
  .problem-zone.flash-good .answer-display{border-color:var(--good); color:var(--good);}
  .problem-zone.flash-bad .answer-display{border-color:var(--bad); color:var(--bad); animation: shake .28s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }

  .numpad{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-top:24px;
    padding-bottom:4px;
  }
  .key{
    font-family:var(--mono);
    font-size:22px;
    font-weight:600;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    padding:18px 0;
    cursor:pointer;
    box-shadow: 0 2px 0 0 #00000040;
    transition: transform .06s ease, box-shadow .06s ease, background .1s ease;
    -webkit-user-select:none; user-select:none;
  }
  .key:active{
    transform: translateY(2px);
    box-shadow:none;
    background:var(--surface-2);
  }
  .key.key-fn{color:var(--text-muted); font-size:15px; font-weight:700;}
  .key.key-clear{color:var(--bad);}

  /* ---------- RESULTS ---------- */
  .results-hero{
    text-align:center;
    padding:26px 0 22px;
    border-bottom:1px solid var(--border);
    margin-bottom:26px;
  }
  .results-hero .big-time{
    font-family:var(--mono);
    font-size:56px;
    font-weight:800;
    color:var(--accent);
    letter-spacing:-0.02em;
    line-height:1;
  }
  .results-hero .big-time .unit{font-size:22px; color:var(--text-muted); font-weight:600; margin-left:4px;}
  .results-hero .cap{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-top:8px;
  }

  .stat-row{display:flex; gap:10px; margin-bottom:28px;}
  .stat-box{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:center;
  }
  .stat-box .v{font-family:var(--mono); font-weight:700; font-size:19px;}
  .stat-box .l{font-size:11px; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.06em;}

  .slowest-title{
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--text-muted);
    margin-bottom:12px;
  }
  .slow-list{display:flex; flex-direction:column; gap:8px; margin-bottom:28px;}
  .slow-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
  }
  .slow-item .rank{font-family:var(--mono); color:var(--text-faint); font-size:12px; width:16px;}
  .slow-item .expr{font-family:var(--mono); font-weight:600; flex:1; font-size:15px;}
  .slow-item .bar-wrap{flex:1; height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; max-width:90px;}
  .slow-item .bar{height:100%; background:var(--bad);}
  .slow-item .t{font-family:var(--mono); color:var(--text-muted); font-size:13px; width:52px; text-align:right;}

  .results-actions{display:flex; gap:10px; margin-top:auto;}
  .results-actions .btn{flex:1;}

  /* utility */
  .hidden{display:none !important;}

  @media (max-width:360px){
    .numpad{gap:8px;}
    .key{padding:15px 0; font-size:20px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="home-header">
      <div class="eyebrow">Mental Math</div>
      <h1>Drill</h1>
    </div>
    <div class="mode-grid">
      <button class="mode-card" onclick="goToSettings('squares')">
        <div class="glyph">n²</div>
        <div class="label">
          <div class="name">Squares</div>
          <div class="desc">n × n, choose digit length</div>
        </div>
        <div class="arrow">→</div>
      </button>
      <button class="mode-card" onclick="goToSettings('multiplication')">
        <div class="glyph">a×b</div>
        <div class="label">
          <div class="name">Multiplication</div>
          <div class="desc">Two factors, adjustable difficulty</div>
        </div>
        <div class="arrow">→</div>
      </button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="screen-settings">
    <div class="top-row">
      <button class="icon-btn" onclick="showScreen('screen-home')">← Back</button>
    </div>
    <div class="eyebrow" id="settings-eyebrow">Settings</div>
    <h2 id="settings-title">Squares</h2>
    <p class="sub" id="settings-sub">Configure your session.</p>

    <div style="height:22px"></div>

    <div class="field-group">
      <label class="field-label">Digits</label>
      <div class="chip-row" id="digits-row"></div>
      <div class="range-preview" id="digits-preview"></div>
    </div>

    <div class="field-group">
      <label class="field-label">Number of problems</label>
      <div class="chip-row" id="count-row"></div>
    </div>

    <div class="toggle-row hidden" id="trivial-row" onclick="toggleTrivial()">
      <div>
        <div class="t-label">Remove trivial</div>
        <div class="t-desc">Exclude factors ending in 0</div>
      </div>
      <div class="switch" id="trivial-switch"></div>
    </div>

    <div class="settings-footer">
      <button class="btn btn-primary btn-block" onclick="startPractice()">Start session</button>
    </div>
  </section>

  <!-- PRACTICE -->
  <section class="screen" id="screen-practice">
    <div class="practice-top">
      <button class="icon-btn" onclick="confirmQuit()">✕ Quit</button>
      <div class="counter"><b id="p-current">1</b> / <span id="p-total">20</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="problem-zone" id="problem-zone">
      <div class="problem-text" id="problem-text"></div>
      <div class="answer-display empty" id="answer-display"><span class="cursor"></span></div>
    </div>

    <div class="numpad" id="numpad">
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key key-fn key-clear" data-k="clear">C</button>
      <button class="key" data-k="0">0</button>
      <button class="key key-fn" data-k="back">⌫</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="screen-results">
    <div class="top-row">
      <div class="eyebrow">Session complete</div>
    </div>
    <div class="results-hero">
      <div class="big-time"><span id="avg-time">0.0</span><span class="unit">s / problem</span></div>
      <div class="cap" id="results-mode-cap">SQUARES · 20 PROBLEMS</div>
    </div>

    <div class="stat-row">
      <div class="stat-box">
        <div class="v" id="stat-fastest">0.0s</div>
        <div class="l">Fastest</div>
      </div>
      <div class="stat-box">
        <div class="v" id="stat-total">0.0s</div>
        <div class="l">Total time</div>
      </div>
      <div class="stat-box">
        <div class="v" id="stat-slowest">0.0s</div>
        <div class="l">Slowest</div>
      </div>
    </div>

    <div class="slowest-title">5 slowest problems</div>
    <div class="slow-list" id="slow-list"></div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="showScreen('screen-home')">Home</button>
      <button class="btn btn-primary" onclick="retrySession()">Retry</button>
    </div>
  </section>

</div>

<script>
/* ---------------- state ---------------- */
const settings = {
  squares:        { digits: 2, count: 20 },
  multiplication: { digits: 2, count: 20, removeTrivial: true }
};

let session = null; // { mode, problems:[{a,b,op,answer,display}], index, times:[], startTs, input:'' }

/* ---------------- navigation ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

let pendingMode = 'squares';

function goToSettings(mode){
  pendingMode = mode;
  renderSettings(mode);
  showScreen('screen-settings');
}

function renderSettings(mode){
  const isSquares = mode === 'squares';
  document.getElementById('settings-eyebrow').textContent = isSquares ? 'Squares' : 'Multiplication';
  document.getElementById('settings-title').textContent = isSquares ? 'Squares' : 'Multiplication';
  document.getElementById('settings-sub').textContent = isSquares
    ? 'n × n — choose how large n gets.'
    : 'a × b — choose factor size and difficulty.';

  const digitOptions = [1,2,3,4];
  const digitsRow = document.getElementById('digits-row');
  digitsRow.innerHTML = '';
  digitOptions.forEach(d => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (settings[mode].digits === d ? ' selected' : '');
    chip.textContent = d;
    chip.onclick = () => {
      settings[mode].digits = d;
      renderSettings(mode);
    };
    digitsRow.appendChild(chip);
  });

  const [lo, hi] = digitRange(settings[mode].digits);
  document.getElementById('digits-preview').textContent =
    isSquares ? `n from ${lo} to ${hi}` : `each factor from ${lo} to ${hi}`;

  const countOptions = [10, 20, 30, 50];
  const countRow = document.getElementById('count-row');
  countRow.innerHTML = '';
  countOptions.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (settings[mode].count === c ? ' selected' : '');
    chip.textContent = c;
    chip.onclick = () => {
      settings[mode].count = c;
      renderSettings(mode);
    };
    countRow.appendChild(chip);
  });

  const trivialRow = document.getElementById('trivial-row');
  if(!isSquares){
    trivialRow.classList.remove('hidden');
    document.getElementById('trivial-switch').classList.toggle('on', settings.multiplication.removeTrivial);
  } else {
    trivialRow.classList.add('hidden');
  }
}

function toggleTrivial(){
  settings.multiplication.removeTrivial = !settings.multiplication.removeTrivial;
  document.getElementById('trivial-switch').classList.toggle('on', settings.multiplication.removeTrivial);
}

function digitRange(d){
  const lo = d === 1 ? 1 : Math.pow(10, d-1);
  const hi = Math.pow(10, d) - 1;
  return [lo, hi];
}

/* ---------------- problem generation ---------------- */
function randInt(lo, hi){
  return Math.floor(Math.random() * (hi - lo + 1)) + lo;
}

function genProblems(mode){
  const conf = settings[mode];
  const [lo, hi] = digitRange(conf.digits);
  const problems = [];

  for(let i=0; i<conf.count; i++){
    if(mode === 'squares'){
      const n = randInt(lo, hi);
      problems.push({ a:n, b:n, opSymbol:'', answer:n*n, display:`${n}<span class="op">²</span>` });
    } else {
      let a, b;
      do{
        a = randInt(lo, hi);
        b = randInt(lo, hi);
      } while(conf.removeTrivial && (a % 10 === 0 || b % 10 === 0));
      problems.push({ a, b, opSymbol:'×', answer:a*b, display:`${a} <span class="op">×</span> ${b}` });
    }
  }
  return problems;
}

/* ---------------- practice flow ---------------- */
function startPractice(){
  const mode = pendingMode;
  const problems = genProblems(mode);
  session = {
    mode,
    problems,
    index: 0,
    times: [],
    startTs: 0,
    input: ''
  };
  document.getElementById('p-total').textContent = problems.length;
  showScreen('screen-practice');
  loadProblem();
}

function loadProblem(){
  const p = session.problems[session.index];
  document.getElementById('problem-text').innerHTML = p.display;
  session.input = '';
  renderInput();
  document.getElementById('p-current').textContent = session.index + 1;
  const pct = (session.index / session.problems.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('problem-zone').classList.remove('flash-good','flash-bad');
  session.startTs = performance.now();
}

function renderInput(){
  const el = document.getElementById('answer-display');
  if(session.input.length === 0){
    el.classList.add('empty');
    el.innerHTML = '<span class="cursor"></span>';
  } else {
    el.classList.remove('empty');
    el.innerHTML = session.input + '<span class="cursor"></span>';
  }
}

function handleKey(k){
  if(!session) return;
  const zone = document.getElementById('problem-zone');
  if(zone.classList.contains('flash-good')) return; // ignore input during transition

  if(k === 'clear'){
    session.input = '';
    renderInput();
    return;
  }
  if(k === 'back'){
    session.input = session.input.slice(0, -1);
    renderInput();
    return;
  }
  // digit
  const p = session.problems[session.index];
  const answerStr = String(p.answer);
  let next = session.input + k;

  // prevent overshoot beyond correct answer length
  if(next.length > answerStr.length){
    next = k; // start fresh with this digit
  }
  session.input = next;
  renderInput();

  if(next === answerStr){
    const elapsed = (performance.now() - session.startTs) / 1000;
    session.times.push({ label: p.display.replace(/<[^>]+>/g,''), seconds: elapsed });
    zone.classList.add('flash-good');
    setTimeout(() => {
      session.index++;
      if(session.index >= session.problems.length){
        finishSession();
      } else {
        loadProblem();
      }
    }, 160);
  } else if(next.length === answerStr.length){
    // wrong, full length typed but incorrect -> shake and clear
    zone.classList.add('flash-bad');
    setTimeout(() => {
      zone.classList.remove('flash-bad');
      session.input = '';
      renderInput();
    }, 260);
  }
}

document.getElementById('numpad').addEventListener('click', (e) => {
  const btn = e.target.closest('.key');
  if(!btn) return;
  handleKey(btn.dataset.k);
});

document.addEventListener('keydown', (e) => {
  if(!document.getElementById('screen-practice').classList.contains('active')) return;
  if(e.key >= '0' && e.key <= '9'){ handleKey(e.key); }
  else if(e.key === 'Backspace'){ handleKey('back'); e.preventDefault(); }
  else if(e.key === 'Escape'){ handleKey('clear'); }
});

function confirmQuit(){
  if(confirm('Quit this session? Progress will be lost.')){
    session = null;
    showScreen('screen-home');
  }
}

/* ---------------- results ---------------- */
function finishSession(){
  const times = session.times.map(t => t.seconds);
  const total = times.reduce((s,v)=>s+v, 0);
  const avg = total / times.length;
  const fastest = Math.min(...times);
  const slowest = Math.max(...times);

  document.getElementById('avg-time').textContent = avg.toFixed(1);
  document.getElementById('results-mode-cap').textContent =
    (session.mode === 'squares' ? 'SQUARES' : 'MULTIPLICATION') + ' · ' + session.problems.length + ' PROBLEMS';
  document.getElementById('stat-fastest').textContent = fastest.toFixed(1) + 's';
  document.getElementById('stat-total').textContent = total.toFixed(1) + 's';
  document.getElementById('stat-slowest').textContent = slowest.toFixed(1) + 's';

  const slowList = [...session.times].sort((a,b) => b.seconds - a.seconds).slice(0,5);
  const maxT = slowList[0] ? slowList[0].seconds : 1;
  const listEl = document.getElementById('slow-list');
  listEl.innerHTML = '';
  slowList.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'slow-item';
    row.innerHTML = `
      <div class="rank">${i+1}</div>
      <div class="expr">${t.label}</div>
      <div class="bar-wrap"><div class="bar" style="width:${(t.seconds/maxT*100).toFixed(0)}%"></div></div>
      <div class="t">${t.seconds.toFixed(1)}s</div>
    `;
    listEl.appendChild(row);
  });

  showScreen('screen-results');
}

function retrySession(){
  goToSettings(session.mode);
}
</script>
